name: deploy

# Manual skeleton only. deploy-develop and promote do not call any cloud API.
# Variable names are listed below; this repo stores no values and no Actions secrets.
# id-token is intentionally not requested. Do not wire OIDC, CAM, or COS
# until cloud architecture has reviewed the permission list in this file.
on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy-develop or promote (not wired; this run will fail)
        type: choice
        options: [deploy-develop, promote]
        default: deploy-develop
      version:
        description: promote target version number (unused)
        required: false

# 权限草案，尚未应用。正式 CAM 策略卡仍须云架构出具，Chief 批准后才能接线。
# 1. 拆两个角色：
#    develop：上传 + GetObject + UpdateFunctionCode，并且只能切换 develop 别名。
#    production：只能切换 production 别名；无 COS；无 UpdateFunctionCode。
# 2. UpdateAlias 不共享。别名名称写死在各自角色的策略里。
# 3. 这是 app 层。保持 UpdateFunctionConfiguration Deny。运行时底座是单独角色 funx-ci-runtime。
# 4. 资源只限打了标签 codename=funx 的平台函数，绝不包含用户函数。
#    COS 只允许 scf-deploy/ci/*（或 Funx 等价前缀）。
# 5. GitHub Environments：develop 与 production。production 必须人工批准。
#    OIDC 的 sub 绑定到对应的 environment。
# 6. 独立云账号。绝不复用 demox-ci-*。

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  skeleton:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      # Names only. Values are not in this repo. Nothing below reads them.
      FUNX_REGION: ${{ vars.FUNX_REGION }}
      FUNX_NAMESPACE: ${{ vars.FUNX_NAMESPACE }}
      FUNX_DEPLOY_ROLE_ARN: ${{ vars.FUNX_DEPLOY_ROLE_ARN }}
      FUNX_DEVELOP_URL: ${{ vars.FUNX_DEVELOP_URL }}
      FUNX_COS_BUCKET: ${{ vars.FUNX_COS_BUCKET }}
      FUNX_COS_REGION: ${{ vars.FUNX_COS_REGION }}
    steps:
      - name: Refuse until deploy is wired
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            deploy-develop|promote) ;;
            *) echo "::error::unknown action"; exit 1 ;;
          esac
          unset FUNX_REGION FUNX_NAMESPACE FUNX_DEPLOY_ROLE_ARN FUNX_DEVELOP_URL FUNX_COS_BUCKET FUNX_COS_REGION
          echo "skeleton action=${ACTION}"
          echo "variable names: FUNX_REGION FUNX_NAMESPACE FUNX_DEPLOY_ROLE_ARN FUNX_DEVELOP_URL FUNX_COS_BUCKET FUNX_COS_REGION"
          echo "::error::deploy is not wired"
          exit 1
